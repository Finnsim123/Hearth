# Hearth stack
#
#   docker compose up -d   -> Hearth + bundled InfluxDB (always included). In the
#                             onboarding wizard you choose whether to USE the
#                             bundled InfluxDB or point Hearth at your own — bring
#                             your own and the bundled one simply stays idle.
#   --profile mqtt      adds Mosquitto (skip if reusing HA's broker)
#
# All dashboards/visuals are custom and live in the Hearth app itself — there is
# no Grafana.

services:
  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: hearth
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:?set in .env}
      DOCKER_INFLUXDB_INIT_ORG: hearth
      DOCKER_INFLUXDB_INIT_BUCKET: hearth_raw
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?set in .env}
    ports:
      - "8086:8086"          # InfluxDB API; remove if only Hearth (same network) uses it
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  hearth:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    restart: unless-stopped
    # No depends_on: Hearth boots without any database and the wizard
    # connects either the bundled influxdb (profile) or an external one.
    volumes:
      - hearth-data:/data          # SQLite, models, logs
      - ./.hearth-shared:/shared   # host updater <-> UI (status + trigger)
    environment:
      HEARTH_SECRET: ${HEARTH_SECRET:?set in .env}   # encrypts tokens at rest
      HEARTH_DATA_DIR: /data
      # Default to the bundled InfluxDB (always running). Choosing your own in
      # the wizard saves that connection instead (restart to apply).
      HEARTH_INFLUX_URL: ${HEARTH_INFLUX_URL:-http://influxdb:8086}
      HEARTH_INFLUX_ORG: ${HEARTH_INFLUX_ORG:-hearth}
      HEARTH_INFLUX_TOKEN: ${INFLUX_TOKEN:-}
      HEARTH_LOG_LEVEL: ${HEARTH_LOG_LEVEL:-INFO}
      # LAN IP the installer detected on the host, so the wizard can tell the user
      # which address to give the Home Assistant integration (the container itself
      # can't see the host's LAN IP). Refreshed on every install.sh run.
      HEARTH_HOST_IP: ${HEARTH_HOST_IP:-}
    ports:
      - "8420:8420"          # web UI + API
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8420/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    profiles: ["mqtt"]
    restart: unless-stopped
    volumes:
      - mosquitto-data:/mosquitto/data
      # Mosquitto 2.x with NO config binds 127.0.0.1 + rejects anonymous —
      # unreachable even from the hearth container. This opens listener 1883
      # and requires the "hearth" user.
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    environment:
      # Generated into .env by install.sh (backfilled on every run, so existing
      # installs pick one up too). Not `:?` on purpose: a hard parse error here
      # would break `docker compose up` for the whole stack, including the
      # self-updater, even for people who never enable this profile.
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    # Hash the password into a passwd file at boot, then hand off to mosquitto.
    # -c recreates the file each start, so rotating MQTT_PASSWORD just works.
    # This overrides `command`, NOT `entrypoint`, on purpose: the image's
    # /docker-entrypoint.sh chowns /mosquitto to the mosquitto user before
    # exec'ing us, and skipping that breaks persistence on the data volume.
    command:
      - /bin/sh
      - -c
      - |
        [ -n "$$MQTT_PASSWORD" ] || {
          echo "MQTT_PASSWORD is not set. Run: bash install.sh (generates one into .env)" >&2
          exit 1
        }
        /usr/bin/mosquitto_passwd -b -c /mosquitto/config/passwd hearth "$$MQTT_PASSWORD"
        chown mosquitto:mosquitto /mosquitto/config/passwd
        chmod 600 /mosquitto/config/passwd
        exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "1883:1883"          # LAN-published so external hubs can subscribe

volumes:
  influxdb-data:
  influxdb-config:
  hearth-data:
  mosquitto-data:
