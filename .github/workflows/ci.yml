name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ./backend[dev]
      - name: pytest
        env:
          HEARTH_SECRET: ci-secret-please-be-long-enough
          HEARTH_NO_RESTART: "1"
        run: pytest backend/hearth/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20 }
      - run: npm install
        working-directory: frontend
      - name: typecheck   # catches undefined imports/identifiers (the black-screen class)
        run: npx tsc -b --noEmit || npx tsc --noEmit
        working-directory: frontend
      - name: build
        run: npm run build
        working-directory: frontend
