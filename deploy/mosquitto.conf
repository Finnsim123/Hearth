# Mosquitto config for Hearth's optional bundled broker (compose profile "mqtt").
#
# Mosquitto 2.x ships locked down: with NO config it binds 127.0.0.1 only and
# refuses anonymous clients — inside a container that means NOTHING can connect,
# not even Hearth on the same compose network. This minimal config opens the
# standard listener and requires a password.
#
# Auth: the compose entrypoint hashes MQTT_PASSWORD (generated into .env by
# install.sh) into the passwd file below as user "hearth", on every start — so
# rotating the password is just an edit in .env plus a restart.
#
# Anonymous access is deliberately OFF. The listener is published on 1883 to the
# whole LAN, because reaching external hubs (Homey, Node-RED, openHAB, HA) is the
# entire reason this profile exists — and the topics carry per-person activity
# state (home / asleep / cooking) and accept commands. An open broker would hand
# that to every device on the network, guests and untrusted IoT included.
#
# Point Hearth at it in Settings → Connections → MQTT: username "hearth",
# password = MQTT_PASSWORD from .env.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
persistence true
persistence_location /mosquitto/data/
