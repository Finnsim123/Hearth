# Mosquitto config for Hearth's optional bundled broker (compose profile "mqtt").
#
# Mosquitto 2.x ships locked down: with NO config it binds 127.0.0.1 only and
# refuses anonymous clients — inside a container that means NOTHING can connect,
# not even Hearth on the same compose network. This minimal config opens the
# standard listener for the homelab case.
#
# Auth: anonymous, matching the common homelab Mosquitto setup. If you want
# credentials, create a password file (mosquitto_passwd), mount it, and set:
#   allow_anonymous false
#   password_file /mosquitto/config/passwords
# then enter the same username/password in Hearth's wizard MQTT step.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
