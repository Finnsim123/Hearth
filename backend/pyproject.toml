[project]
name = "hearth"
version = "0.0.1"
description = "Self-hosted human activity recognition for Home Assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "influxdb-client>=1.45",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "shap>=0.46",
    "hdbscan>=0.8.38",
    "umap-learn>=0.5.6",
    "aiohttp>=3.10",          # HA WebSocket client
    "paho-mqtt>=2.1",
    "cryptography>=43.0",     # token encryption at rest (Fernet via security.py)
    "argon2-cffi>=23.1",      # password hashing (security.py only)
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["hearth/tests"]
asyncio_mode = "auto"
